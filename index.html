<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>AI Agent // PHANTOM UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E60012;
  --red-dark: #A8000D;
  --black: #0A0A0A;
  --black-2: #111111;
  --white: #FFFFFF;
  --off-white: #F4F4F0;
  --yellow: #FFD400;
  --border-thick: 3px solid var(--black);
  --border-red: 3px solid var(--red);
  --hard-shadow: 6px 6px 0 var(--black);
  --hard-shadow-red: 6px 6px 0 var(--red);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { 
  height: 100%; 
  overflow: hidden; 
  font-family: 'Space Grotesk', sans-serif; 
  background-color: var(--black);
  background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 15px 15px;
  color: var(--white); 
  font-size: 14px; 
  display: flex; 
  flex-direction: column; 
}

::-webkit-scrollbar { width: 8px; height: 8px; } 
::-webkit-scrollbar-track { background: var(--black); } 
::-webkit-scrollbar-thumb { background: var(--red); border: 2px solid var(--black); }
::-webkit-scrollbar-thumb:hover { background: var(--yellow); }

h1, h2, h3, .brand-text, .btn-icon, button, .title-font { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
.font-anton { font-family: 'Anton', sans-serif; letter-spacing: 0px; }

header { padding: 10px 20px; background: var(--black); border-bottom: var(--border-red); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 10; position: relative; }
header::after { content: ''; position: absolute; bottom: -6px; left: 0; right: 0; height: 3px; background: var(--black); z-index: -1; }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; margin-right: 8px; }
.brand-icon { width: 36px; height: 36px; background: var(--red); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 20px; border: var(--border-thick); box-shadow: 3px 3px 0 var(--white); transform: rotate(-5deg); }

.select-wrapper { position: relative; display: flex; align-items: center; }
.select-icon { position: absolute; left: 10px; font-size: 16px; pointer-events: none; }
header select, header input, .btn-icon { padding: 8px 12px; border: var(--border-thick); background: var(--off-white); color: var(--black); font-size: 15px; font-family: inherit; font-weight: 700; outline: none; appearance: none; transition: transform 0.1s, box-shadow 0.1s; }
header select:focus, header input:focus { border-color: var(--red); }

header select.with-icon { padding-left: 34px; min-width: 170px; cursor: pointer; }
header select:not(.with-icon) { cursor: pointer; }
#model { flex: 1; min-width: 160px; }

.btn-icon { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: var(--red); color: var(--white); border-color: var(--black); box-shadow: 3px 3px 0 var(--black); transform: translate(0,0); }
.btn-icon:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--black); }
.btn-icon:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--black); }
.btn-icon.danger { background: var(--yellow); color: var(--black); }
.badge { background: var(--black); color: var(--yellow); border: 2px solid var(--yellow); padding: 1px 6px; font-size: 13px; font-weight: bold; }

#tokenBar { padding: 8px 20px; background: var(--black-2); border-bottom: 2px dashed var(--off-white); display: flex; gap: 16px; align-items: center; font-size: 13px; flex-shrink: 0; }
.stat { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--off-white); text-transform: uppercase;}
#tokenTrack { flex: 1; height: 10px; background: var(--black); border: 2px solid var(--off-white); overflow: hidden; min-width: 100px; }
#tokenFill { height: 100%; width: 0%; background: var(--red); transition: width 0.4s ease; }
#quotaInfo { color: var(--black); font-weight: 800; background: var(--yellow); padding: 2px 8px; border: 2px solid var(--black); font-size: 12px; transform: rotate(-2deg); }
#quotaInfo:empty { display: none; }

.layout { flex: 1; display: flex; overflow: hidden; position: relative; }

aside { width: 280px; background: var(--black-2); border-right: 4px solid var(--red); flex-shrink: 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; z-index: 5; }
.sb-section { padding: 16px; border-bottom: 2px dashed #333; }
.sb-section:last-child { border-bottom: none; flex: 1; overflow-y: auto; }
.sb-section h3 { font-size: 18px; color: var(--yellow); margin-bottom: 12px; display: flex; justify-content: space-between; text-transform: uppercase; }

.btn-new { width: 100%; padding: 12px; background: var(--red); color: var(--white); border: var(--border-thick); cursor: pointer; font-size: 18px; transition: 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 4px 4px 0 var(--white); text-transform: uppercase; }
.btn-new:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--white); }
.btn-new:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--white); }

.chat-item { padding: 10px 12px; background: var(--off-white); color: var(--black); margin-bottom: 8px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; border: var(--border-thick); transition: 0.15s; position: relative; overflow: hidden; box-shadow: 3px 3px 0 var(--red); }
.chat-item:nth-child(even) { transform: rotate(1deg); }
.chat-item:nth-child(odd) { transform: rotate(-1deg); }
.chat-item:hover { transform: scale(1.02) rotate(0deg); box-shadow: 5px 5px 0 var(--yellow); background: var(--white); }
.chat-item.active { background: var(--red); color: var(--white); box-shadow: 3px 3px 0 var(--yellow); border-color: var(--yellow); }
.chat-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.chat-item button { background: var(--black); border: none; color: var(--white); cursor: pointer; font-size: 14px; padding: 2px 6px; }
.chat-item button:hover { background: var(--red); }

.file { padding: 8px 10px; background: var(--black); border: 2px solid var(--off-white); margin-bottom: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; color: var(--off-white); }
.file button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; font-weight: bold; } 

aside input[type=file] { font-size: 12px; width: 100%; color: var(--off-white); margin-top: 8px; }
aside input[type=file]::file-selector-button { background: var(--off-white); color: var(--black); border: var(--border-thick); padding: 6px 10px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.1s; }
aside input[type=file]::file-selector-button:hover { background: var(--yellow); }

main { flex: 1; overflow-y: auto; padding: 30px 20px; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; position: relative; }

.msg { max-width: 85%; padding: 16px 20px; line-height: 1.5; font-size: 16px; font-weight: 500; position: relative; animation: slideUp 0.2s ease; word-wrap: break-word; border: var(--border-thick); }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.msg.user { align-self: flex-end; background: var(--red); color: var(--white); box-shadow: -5px -5px 0 var(--black); transform: rotate(1deg); }
.msg.assistant { align-self: flex-start; background: var(--off-white); color: var(--black); box-shadow: 5px 5px 0 var(--black); transform: rotate(-1deg); }
.msg.assistant::before { content: 'AI //'; position: absolute; left: 10px; top: -12px; background: var(--yellow); color: var(--black); font-family: 'Bebas Neue'; font-size: 16px; font-weight: bold; padding: 2px 8px; border: 2px solid var(--black); transform: rotate(-3deg); }

.msg.tool { align-self: flex-start; background: var(--black); border: 2px dashed var(--yellow); font-size: 13px; font-family: monospace; color: var(--yellow); padding: 8px 12px; margin-left: 20px; }
.msg.error { align-self: center; background: var(--yellow); border: var(--border-thick); color: var(--black); font-size: 14px; font-weight: 700; padding: 12px 20px; text-align: center; box-shadow: 4px 4px 0 var(--black); transform: rotate(-2deg); }
.msg.memory { align-self: center; background: var(--off-white); border: 2px solid var(--red); color: var(--red); font-size: 13px; font-weight: bold; padding: 6px 16px; transform: rotate(2deg); box-shadow: 3px 3px 0 var(--black); }

.typing { align-self: flex-start; background: var(--off-white); border: var(--border-thick); padding: 16px 20px; display: flex; gap: 6px; align-items: center; box-shadow: 5px 5px 0 var(--black); transform: rotate(-1deg); }
.typing::before { content: 'THINKING...'; font-family: 'Bebas Neue'; color: var(--black); margin-right: 10px; font-size: 16px; }
.typing span { width: 8px; height: 8px; background: var(--red); animation: bounce 1s infinite alternate; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-6px); } }

#chatPlaceholder { color: var(--off-white); text-align: center; margin: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; border: 4px dashed var(--red); padding: 40px; transform: rotate(-2deg); background: rgba(0,0,0,0.5); }
#chatPlaceholder .ph-icon { font-size: 60px; color: var(--yellow); margin-bottom: 10px; font-family: 'Anton'; }
#chatPlaceholder .ph-title { font-size: 32px; font-family: 'Anton'; letter-spacing: 2px; color: var(--white); text-transform: uppercase; }
#chatPlaceholder .ph-sub { font-size: 16px; font-weight: 600; }

footer { padding: 16px 20px; background: var(--black-2); border-top: 4px solid var(--red); display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
.input-row { display: flex; gap: 12px; align-items: flex-end; width: 100%; }

footer textarea { flex: 1; padding: 14px 20px; border: var(--border-thick); background: var(--off-white); color: var(--black); resize: none; min-height: 54px; max-height: 200px; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; line-height: 1.4; outline: none; }
footer textarea:focus { border-color: var(--yellow); box-shadow: inset 0 0 0 2px var(--yellow); }

footer .btn-attach { height: 54px; width: 54px; background: var(--yellow); border: var(--border-thick); color: var(--black); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; flex-shrink: 0; transition: 0.1s; box-shadow: 3px 3px 0 var(--black); }
footer .btn-attach:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--black); }
footer .btn-attach:active { transform: translate(2px,2px); box-shadow: none; }

footer button#send { height: 54px; padding: 0 30px; background: var(--red); color: var(--white); border: var(--border-thick); cursor: pointer; font-size: 24px; font-family: 'Bebas Neue'; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 4px 4px 0 var(--black); transition: 0.1s; text-transform: uppercase; }
footer button#send:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--black); background: var(--yellow); color: var(--black); }
footer button#send:active:not(:disabled) { transform: translate(2px,2px); box-shadow: 0px 0px 0 var(--black); }
footer button#send:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

.image-preview-container { display: none; padding: 10px; background: var(--off-white); border: var(--border-thick); position: relative; width: fit-content; box-shadow: 3px 3px 0 var(--red); margin-bottom: 10px;}
.image-preview-container img { height: 60px; border: 2px solid var(--black); display: block; }
.image-preview-container button { position: absolute; top: -12px; right: -12px; background: var(--red); color: white; border: 2px solid var(--black); width: 26px; height: 26px; cursor: pointer; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
.msg-image { max-width: 100%; border: 3px solid var(--black); margin-top: 10px; display: block; }
.msg-link { color: var(--red); font-weight: 700; text-decoration: underline; }
.msg-link:hover { color: var(--yellow); background: var(--black); padding: 0 4px; }

.overlay { position: fixed; inset: 0; background: rgba(10, 10, 10, 0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.overlay.active { display: flex; }
.modal { background: var(--off-white); color: var(--black); border: 4px solid var(--black); padding: 24px; width: 100%; max-width: 480px; box-shadow: 12px 12px 0 var(--red); animation: scaleIn 0.2s cubic-bezier(.17,.89,.32,1.28); }
@keyframes scaleIn { from { transform: scale(0.8) rotate(5deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
.modal h3 { font-size: 28px; margin-bottom: 16px; text-transform: uppercase; border-bottom: 4px solid var(--red); padding-bottom: 8px; }
.modal input, .modal textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--white); border: 3px solid var(--black); color: var(--black); font-size: 15px; font-family: inherit; font-weight: 600; outline: none; }
.modal input:focus, .modal textarea:focus { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }
.modal button { width: 100%; padding: 14px; background: var(--black); color: var(--white); border: 3px solid var(--black); cursor: pointer; font-size: 20px; margin-bottom: 8px; transition: 0.1s; font-family: 'Bebas Neue'; letter-spacing: 1px; }
.modal button:hover { background: var(--red); transform: translate(-2px,-2px); box-shadow: 4px 4px 0 var(--black); }
.modal button:active { transform: translate(2px,2px); box-shadow: none; }
.modal button.secondary { background: var(--off-white); color: var(--black); border: 3px solid var(--black); }
.modal button.secondary:hover { background: var(--yellow); }

.key-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--white); border: 2px solid var(--black); margin-bottom: 8px; box-shadow: 2px 2px 0 var(--red); }
.key-item code { background: var(--black); padding: 4px 8px; font-size: 12px; color: var(--yellow); font-family: monospace; }
.empty-state { color: var(--black); font-size: 15px; font-weight: 600; text-align: center; padding: 20px; border: 2px dashed var(--black); }

.spinner { width: 20px; height: 20px; border: 3px solid var(--black); border-top-color: var(--white); animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.sources-container { margin-top: 16px; }
.source-pill-new { display: inline-flex; align-items: center; gap: 10px; background: var(--yellow); color: var(--black); border: 3px solid var(--black); padding: 6px 14px 6px 6px; cursor: pointer; transition: 0.1s; font-size: 14px; font-weight: 800; box-shadow: 3px 3px 0 var(--black); text-transform: uppercase; }
.source-pill-new:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 var(--black); background: var(--white); }
.source-pill-new:active { transform: translate(2px, 2px); box-shadow: none; }
.favicon-stack { display: flex; align-items: center; }
.favicon-stack img { width: 22px; height: 22px; border: 2px solid var(--black); background: #fff; object-fit: contain; }
.favicon-stack img:not(:first-child) { margin-left: -8px; }

.source-list-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--white); border: 3px solid var(--black); margin-bottom: 8px; text-decoration: none; color: var(--black); transition: 0.1s; box-shadow: 3px 3px 0 var(--red); }
.source-list-item:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--red); background: var(--yellow); }
.source-list-item img { width: 24px; height: 24px; border: 2px solid var(--black); background: #fff; }
.source-list-item div { display: flex; flex-direction: column; overflow: hidden; }
.source-list-item .src-title { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.source-list-item .src-domain { font-size: 12px; font-weight: 600; color: var(--red); }

#sidebarToggle { display: none; }

@media (max-width: 768px) {
  #sidebarToggle { display: flex; } 
  .brand span.brand-text { display: none; }
  aside { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 290px; z-index: 50; }
  aside.open { transform: translateX(0); }
  main { padding: 16px; } 
  .msg { max-width: 92%; }
  .msg.assistant::before { display: none; } 
  .msg.tool { margin-left: 0; }
  header { padding: 10px; gap: 6px; } 
  header select.with-icon { min-width: 130px; }
  #tokenBar { font-size: 10px; padding: 6px 10px; gap: 10px; } 
  .stat strong { font-size: 11px; }
  footer { padding: 12px; gap: 8px; } 
  footer textarea { font-size: 15px; min-height: 48px; } 
  footer button#send { padding: 0 20px; font-size: 20px; }
  .modal { padding: 16px; }
}
</style>
</head>
<body>

<!-- =========================================
     HEADER / GAME UI
========================================= -->
<header>
  <button id="sidebarToggle" class="btn-icon" onclick="toggleSidebar()">☰</button>
  <div class="brand"><div class="brand-icon">P5</div><span class="brand-text">PHANTOM AI</span></div>
  
  <div class="select-wrapper">
    <span class="select-icon" id="provider-icon">🤖</span>
    <select id="provider" class="with-icon" onchange="handleProviderChange()">
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
      <option value="deepseek">DeepSeek</option>
      <option value="gemini">Google Gemini</option>
      <option value="openrouter">OpenRouter</option>
      <option value="groq">Groq</option>
      <option value="howtofix">HowToFix</option>
    </select>
  </div>
  
  <select id="model" onchange="handleModelChange()"></select>
  
  <button class="btn-icon" onclick="openMemory()">🧠 <span class="badge" id="memCount">0</span></button>
  <button class="btn-icon" onclick="openSettings()">🔑 KEYS</button>
  <button class="btn-icon danger" onclick="doLogout()">KELUAR</button>
</header>

<!-- =========================================
     TOKEN BAR
========================================= -->
<div id="tokenBar">
  <span class="stat">📊 <strong id="tokenCount">0</strong> / <span id="tokenLimit">128k</span> TOKEN</span>
  <div id="tokenTrack"><div id="tokenFill"></div></div>
  <span id="quotaInfo"></span>
</div>

<!-- =========================================
     MAIN LAYOUT
========================================= -->
<div class="layout">
  <aside id="sidebar">
    <div class="sb-section"><button class="btn-new" onclick="newChat()">＋ NEW CHAT</button></div>
    <div class="sb-section"><h3>💬 RECORDS <span class="badge" id="chatCount">0</span></h3><div id="chatList"></div></div>
    <div class="sb-section"><h3>📁 DATA <span class="badge" id="fileCount">0</span>/20</h3><input type="file" id="fileInput" multiple><div id="fileList" style="margin-top:12px;"></div></div>
  </aside>
  
  <main id="chat">
    <div id="chatPlaceholder"><span class="ph-icon">//01</span><div class="ph-title">ACCESS GRANTED</div><div class="ph-sub">SYSTEM ONLINE. AWAITING INPUT.</div></div>
  </main>
</div>

<!-- =========================================
     FOOTER / INPUT
========================================= -->
<footer>
  <div class="image-preview-container" id="imagePreviewContainer">
    <img id="imagePreviewImg" src="" alt="Preview">
    <button onclick="removeAttachedImage()">✕</button>
  </div>
  <div class="input-row">
    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
    <button class="btn-attach" onclick="document.getElementById('imageInput').click()" title="Lampirkan Gambar">📎</button>
    <textarea id="input" placeholder="TRANSMIT MESSAGE..." rows="1"></textarea>
    <button id="send" onclick="send()"><span id="sendLabel">SEND</span></button>
  </div>
</footer>

<!-- =========================================
     MODALS
========================================= -->
<div id="sourcesOverlay" class="overlay">
  <div class="modal">
    <h3>// SOURCES FOUND</h3>
    <div id="sourcesModalList" style="max-height:60vh;overflow-y:auto;padding-right:4px;margin-bottom:16px;"></div>
    <button class="secondary" onclick="document.getElementById('sourcesOverlay').classList.remove('active')">CLOSE</button>
  </div>
</div>

<div id="loginOverlay" class="overlay active">
  <div class="modal">
    <h3>// SECURITY CHECK</h3>
    <p style="margin-bottom:12px; font-weight:600;">ENTER PASSWORD TO ACCESS</p>
    <input id="loginPassword" type="password" placeholder="PASSWORD" autocomplete="current-password">
    <button onclick="doLogin()">CONNECT</button>
    <div id="loginError" class="error" style="color:var(--red);text-align:center;margin-top:10px;font-weight:bold;font-size:14px;"></div>
  </div>
</div>

<div id="settingsOverlay" class="overlay">
  <div class="modal">
    <h3>// API KEYS</h3>
    <div id="keyList" style="margin-bottom:20px;"></div>
    <input id="newProvider" list="provider-list" placeholder="PROVIDER (openai / anthropic / deepseek / gemini / openrouter / groq / howtofix)">
    <datalist id="provider-list"><option value="openai"></option><option value="anthropic"></option><option value="deepseek"></option><option value="gemini"></option><option value="openrouter"></option><option value="groq"></option><option value="howtofix"></option></datalist>
    <input id="newKey" type="password" placeholder="API KEY">
    <button onclick="saveKey()">SAVE</button>
    <button class="secondary" onclick="closeSettings()">CLOSE</button>
  </div>
</div>

<div id="memoryOverlay" class="overlay">
  <div class="modal">
    <h3>// AI MEMORY</h3>
    <div id="memoryList" style="margin-bottom:20px;max-height:40vh;overflow-y:auto;"></div>
    <textarea id="newMemory" placeholder="ADD MANUAL FACT..."></textarea>
    <button onclick="addMemory()">＋ ADD</button>
    <button class="secondary" onclick="closeMemory()">CLOSE</button>
  </div>
</div>

<!-- =========================================
     JAVASCRIPT LOGIC
========================================= -->
<script>
const $ = s => document.querySelector(s);
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatTokens = n => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(n);

const PROVIDER_ICONS = { openai: '🤖', anthropic: '🧠', deepseek: '🐳', gemini: '✨', openrouter: '🔀', groq: '⚡', howtofix: '🔧' };

function resetUsage() { sessionUsage = { total: 0 }; lastContextTokens = 0; updateTokenBar(); }
function updateTokenBar() {
  const model = $('#model').value; const limit = MODEL_LIMITS[model] || 128000;
  const used = lastContextTokens > 0 ? lastContextTokens : sessionUsage.total;
  const pct = Math.min(100, (used / limit) * 100);
  const fill = $('#tokenFill'); fill.style.width = pct + '%';
  fill.style.background = pct > 80 ? '#ef4444' : pct > 50 ? '#f59e0b' : 'var(--red)';
  $('#tokenCount').textContent = formatTokens(used); $('#tokenLimit').textContent = formatTokens(limit);
  const provider = $('#provider').value;
  if (provider === 'openrouter' && quotaRemaining !== null) $('#quotaInfo').textContent = `💰 $${Number(quotaRemaining).toFixed(2)} LEFT`;
  else if (provider === 'groq' && quotaRemaining !== null) $('#quotaInfo').textContent = `⚡ ${formatTokens(quotaRemaining)} LEFT`;
  else $('#quotaInfo').textContent = '';
}

function openDB() { return new Promise((res, rej) => { const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = () => req.result.createObjectStore(STORE); req.onsuccess = () => { db = req.result; res(); }; req.onerror = () => rej(req.error); }); }
const tx = m => db.transaction(STORE, m).objectStore(STORE);
const dbPut = (k, v) => new Promise((res, rej) => { const r = tx('readwrite').put(v, k); r.onsuccess = res; r.onerror = () => rej(r.error); });
const dbGet = k => new Promise((res, rej) => { const r = tx('readonly').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbKeys = () => new Promise((res, rej) => { const r = tx('readonly').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbDel = k => new Promise((res, rej) => { const r = tx('readwrite').delete(k); r.onsuccess = res; r.onerror = () => rej(r.error); });
const isTextFile = f => f.type.startsWith('text/') || /\.(md|txt|json|js|ts|jsx|tsx|py|html|css|csv|xml|yaml|yml|sh|java|c|cpp|h|go|rs|rb|php|sql|log|env|toml|ini)$/i.test(f.name);

async function refreshFiles() {
  const keys = await dbKeys(); files = [];
  for (const k of keys) { const m = await dbGet(k); if (m) files.push({ id: k, name: m.name, size: m.size, type: m.type, isText: m.isText }); }
  $('#fileCount').textContent = files.length; const list = $('#fileList'); list.innerHTML = '';
  if (!files.length) { list.innerHTML = '<div class="empty-state">NO DATA FOUND.</div>'; return; }
  files.forEach(f => { const div = document.createElement('div'); div.className = 'file'; const span = document.createElement('span'); span.title = f.name; span.innerHTML = `${f.name.length > 18 ? f.name.slice(0,18)+'…' : f.name} <span style="color:var(--red);font-size:10px;">· ${fmtSize(f.size)}</span>`; const btn = document.createElement('button'); btn.textContent = '✕'; btn.onclick = async () => { await dbDel(f.id); await refreshFiles(); }; div.appendChild(span); div.appendChild(btn); list.appendChild(div); });
}

$('#fileInput').onchange = async e => {
  const selected = Array.from(e.target.files); let total = files.reduce((s, f) => s + f.size, 0);
  for (const file of selected) {
    if (files.length >= MAX_FILES) { alert('Maksimal 20 file.'); break; }
    if (total + file.size > MAX_TOTAL) { alert('Total > 500MB.'); break; }
    const id = 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    if (isTextFile(file)) { const content = await file.text(); await dbPut(id, { name: file.name, size: file.size, type: file.type, isText: true, content }); }
    else { const buf = await file.arrayBuffer(); const bytes = new Uint8Array(buf); let bin = ''; const CH = 0x8000; for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); await dbPut(id, { name: file.name, size: file.size, type: file.type, isText: false, content: btoa(bin) }); }
    total += file.size;
  }
  e.target.value = ''; await refreshFiles();
};

function handleImageSelect(e) {
  const file = e.target.files[0]; if (!file) return;
  if (file.size > 4 * 1024 * 1024) return alert('Gambar maksimal 4MB untuk AI Vision.');
  const reader = new FileReader();
  reader.onload = (ev) => {
    attachedImageBase64 = ev.target.result;
    $('#imagePreviewImg').src = attachedImageBase64;
    $('#imagePreviewContainer').style.display = 'block';
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function removeAttachedImage() {
  attachedImageBase64 = null;
  $('#imagePreviewContainer').style.display = 'none';
  $('#imagePreviewImg').src = '';
}
$('#input').addEventListener('paste', (e) => {
  const items = e.clipboardData.items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      const file = items[i].getAsFile();
      if (file.size > 4 * 1024 * 1024) return alert('Gambar maksimal 4MB.');
      const reader = new FileReader();
      reader.onload = (ev) => {
        attachedImageBase64 = ev.target.result;
        $('#imagePreviewImg').src = attachedImageBase64;
        $('#imagePreviewContainer').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }
});

function formatMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/!\[(.*?)\]\((.*?)\)/g, (match, alt, url) => `<img src="${url}" alt="${alt}" class="msg-image" onerror="this.style.display='none'">`);
  html = html.replace(/\[(.*?)\]\((.*?)\)/g, (match, text, url) => {
    const isImage = url.match(/\.(jpeg|jpg|gif|png|webp)/i) || url.includes('images.unsplash.com') || url.includes('cdn.');
    if (isImage) return `<img src="${url}" alt="${text}" class="msg-image" title="${text}" onerror="this.style.display='none'">`;
    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="msg-link">${text}</a>`;
  });
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function renderMessages() {
  const chatEl = $('#chat'); chatEl.innerHTML = '';
  if (messages.length === 0) { chatEl.innerHTML = `<div id="chatPlaceholder"><span class="ph-icon">//01</span><div class="ph-title">ACCESS GRANTED</div><div class="ph-sub">SYSTEM ONLINE. AWAITING INPUT.</div></div>`; return; }
  
  for (let i = 0; i < messages.length; i++) {
    const m = messages[i];
    if (m.role === 'system') continue;
    if (m.role === 'user') {
      let text = m.content, img = null;
      if (Array.isArray(m.content)) {
        text = m.content.find(c => c.type === 'text')?.text || '';
        img = m.content.find(c => c.type === 'image_url')?.image_url?.url;
      }
      addMsgEl('user', text, img);
    }
    else if (m.role === 'assistant') {
      if (m.content) {
        let histSources = [];
        const toolMsgs = messages.slice(0, i).filter(x => x.role === 'tool');
        toolMsgs.forEach(tm => {
          const regex = /Sumber: (https?:\/\/[^\s]+)/g;
          let match;
          while ((match = regex.exec(tm.content)) !== null) histSources.push({ url: match[1] });
        });
        addMsgEl('assistant', m.content, null, histSources);
      }
      if (m.tool_calls) for (const tc of m.tool_calls) addMsgEl('tool', `> EXECUTING: ${tc.function.name}(${String(tc.function.arguments).slice(0, 80)})`);
    }
  }
}

function addMsgEl(role, content, imgSrc = null, sources = []) {
  const ph = $('#chatPlaceholder'); if (ph) ph.remove();
  const div = document.createElement('div'); div.className = 'msg ' + role;
  
  const textNode = document.createElement('div');
  if (role === 'assistant') textNode.innerHTML = formatMarkdown(content);
  else textNode.textContent = content;
  div.appendChild(textNode);

  if (imgSrc) {
    const imgEl = document.createElement('img');
    imgEl.src = imgSrc; imgEl.className = 'msg-image';
    div.appendChild(imgEl);
  }

  if (role === 'assistant' && sources && sources.length > 0) {
    const uniqueSources = [];
    const seen = new Set();
    sources.forEach(s => {
      if (s.url && !seen.has(s.url)) { seen.add(s.url); uniqueSources.push(s); }
    });

    if (uniqueSources.length > 0) {
      const sourceDiv = document.createElement('div');
      sourceDiv.className = 'sources-container';
      
      let stackHtml = '<div class="favicon-stack">';
      const domainsToShow = uniqueSources.slice(0, 4);
      domainsToShow.forEach(s => {
        try {
          const domain = new URL(s.url).hostname.replace('www.', '');
          const fav = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
          stackHtml += `<img src="${fav}" onerror="this.style.display='none'">`;
        } catch(e) {}
      });
      stackHtml += '</div>';

      const pill = document.createElement('div');
      pill.className = 'source-pill-new';
      pill.innerHTML = `${stackHtml}<span>${uniqueSources.length} PAGES</span>`;
      
      pill.onclick = () => {
        window._currentSources = uniqueSources;
        openSourcesModal(uniqueSources);
      };

      sourceDiv.appendChild(pill);
      div.appendChild(sourceDiv);
    }
  }

  $('#chat').appendChild(div); $('#chat').scrollTop = $('#chat').scrollHeight;
}

async function callTool(name, a) {
  if (name === 'list_files') return files.length ? files.map(f => `${f.name} (${fmtSize(f.size)}, ${f.isText ? 'text' : 'binary'})`).join('\n') : 'Tidak ada file.';
  if (name === 'read_file') { const f = files.find(x => x.name === a.name); if (!f) return `File "${a.name}" tidak ditemukan.`; if (!f.isText) return `File "${a.name}" bukan text.`; const d = await dbGet(f.id); const offset = a.offset || 0, limit = Math.min(a.limit || 8000, 20000); return `[${f.name} | total ${d.content.length} char | offset ${offset}]\n${d.content.slice(offset, offset + limit)}`; }
  if (name === 'search_files') { const q = a.query.toLowerCase(); const out = []; for (const f of files) { if (!f.isText) continue; const d = await dbGet(f.id); const i = d.content.toLowerCase().indexOf(q); if (i >= 0) out.push(`=== ${f.name} ===\n...${d.content.slice(Math.max(0, i - 80), i + 160)}...`); } return out.length ? out.join('\n\n') : 'Tidak ada hasil.'; }
  if (name === 'list_recent_chats') { const r = await fetch('/api/chats'); const list = await r.json(); const lim = a.limit || 5; return list.slice(0, lim).map(c => `[${c.id}] ${c.title} (${new Date(c.updatedAt).toLocaleDateString('id-ID')})`).join('\n') || 'Belum ada chat.'; }
  if (name === 'read_chat') { const r = await fetch(`/api/chats?id=${a.id}`); if (!r.ok) return 'Chat tidak ditemukan.'; const chat = await r.json(); const msgs = (chat.messages || []).filter(m => m.role === 'user' || m.role === 'assistant').slice(-(a.limit || 20)); return `=== ${chat.title} ===\n\n` + msgs.map(m => `${m.role.toUpperCase()}: ${String(m.content || '').slice(0, 500)}`).join('\n\n'); }
  if (name === 'remember') { if (!a.text || !a.text.trim()) return 'Gagal.'; const r = await fetch('/api/memory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: a.text }) }); if (r.ok) { await loadMemory(); addMsgEl('memory', `[ MEMORY SAVED: ${a.text} ]`); return `✓ Tersimpan.`; } return 'Gagal.'; }
  
  if (name === 'search_internet') {
    const r = await fetch('/api/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: a.query }) });
    if (!r.ok) return 'Gagal mencari di internet.';
    const data = await r.json();
    if (data.error) return `Error pencarian: ${data.error}`;
    
    if (data.results) {
      data.results.forEach(res => {
        if (res.url) activeSearchSources.push({ url: res.url, title: res.title });
      });
    }
    
    return data.results.map(x => `- ${x.title}\n${x.content}\nSumber: ${x.url}`).join('\n\n');
  }
  
  return 'Tool tidak dikenal.';
}

async function send() {
  if (busy) return; 
  const text = $('#input').value.trim(); 
  if (!text && !attachedImageBase64) return; 
  if (!currentChatId) await newChat();
  
  const provider = $('#provider').value; const model = $('#model').value; if (!model) return alert('Pilih model');
  
  busy = true; setSendBusy(true); $('#input').value = ''; $('#input').style.height = 'auto'; 
  
  let userContent = text;
  if (attachedImageBase64) {
    userContent = [];
    if (text) userContent.push({ type: 'text', text: text });
    userContent.push({ type: 'image_url', image_url: { url: attachedImageBase64 } });
  }

  addMsgEl('user', text, attachedImageBase64); 
  messages.push({ role: 'user', content: userContent }); 
  
  removeAttachedImage(); 
  activeSearchSources = []; 
  showTyping();
  
  try {
    for (let guard = 0; guard < 12; guard++) {
      const now = new Date();
      const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const dynamicPrompt = SYSTEM_PROMPT + `\n\n[INFO REAL-TIME]: Hari ini adalah ${dateStr}, pukul ${timeStr} (Waktu Lokal User).`;

      const res = await fetch('/api/chat', { 
        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ provider, model, messages: [{ role: 'system', content: dynamicPrompt }, ...messages], tools: TOOLS }) 
      });
      
      if (res.status === 401) { removeTyping(); addMsgEl('error', 'ERROR // SESSION EXPIRED'); $('#loginOverlay').classList.add('active'); break; }
      if (!res.ok) { const errText = await res.text(); throw new Error(`${res.status}: ${errText.slice(0, 200)}`); }
      const data = await res.json();
      
      if (data.usage) { sessionUsage.total += (data.usage.total_tokens || 0); lastContextTokens = (data.usage.prompt_tokens || 0) + (data.usage.completion_tokens || 0); updateTokenBar(); }
      const msg = data.choices?.[0]?.message; if (!msg) throw new Error('Response LLM tidak valid'); messages.push(msg);
      
      if (msg.tool_calls?.length) { 
        removeTyping(); 
        for (const tc of msg.tool_calls) { 
          const args = JSON.parse(tc.function.arguments || '{}'); 
          addMsgEl('tool', `> EXEC: ${tc.function.name}(${JSON.stringify(args).slice(0, 80)})`); 
          const result = await callTool(tc.function.name, args); 
          messages.push({ role: 'tool', tool_call_id: tc.id, content: result }); 
        } 
        showTyping(); 
      }
      else { 
        removeTyping(); 
        addMsgEl('assistant', msg.content || '(kosong)', null, activeSearchSources); 
        activeSearchSources = []; 
        break; 
      }
    }
  } catch (e) { removeTyping(); addMsgEl('error', 'ERROR // ' + e.message); }
  finally { removeTyping(); busy = false; setSendBusy(false); if (currentChatId) await saveCurrentChat(); updateTokenBar(); }
}

$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('#input').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 200) + 'px'; });

async function bootAfterLogin() { $('#loginOverlay').classList.remove('active'); await loadChats(); await loadMemory(); await fetchQuota(); if (chats.length > 0) await switchChat(chats[0].id); else await newChat(); }
(async () => { await openDB(); await refreshFiles(); const ok = await checkAuth(); if (!ok) { $('#loginOverlay').classList.add('active'); return; } await bootAfterLogin(); })();
</script>
