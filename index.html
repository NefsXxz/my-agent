<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>AI Agent Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #05080f; --bg-surface: #0d121f; --bg-glass: rgba(13, 18, 31, 0.75); --border: rgba(255,255,255,0.08); --border-focus: rgba(99,102,241,0.5); --text: #f1f5f9; --text-muted: #94a3b8; --primary: #6366f1; --primary-glow: rgba(99,102,241,0.4); --gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); --gradient-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); --danger: #ef4444; --success: #10b981; --radius: 12px; --radius-sm: 8px; --radius-lg: 20px; --shadow-glow: 0 0 20px var(--primary-glow); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
body { background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; }
::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
header { padding: 12px 20px; background: var(--bg-glass); backdrop-filter: blur(16px); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--border); z-index: 10; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-right: 8px; }
.brand-icon { width: 32px; height: 32px; border-radius: 10px; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: var(--shadow-glow); }
.select-wrapper { position: relative; display: flex; align-items: center; }
.select-icon { position: absolute; left: 12px; font-size: 16px; pointer-events: none; }
header select, header input, .btn-icon { padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: var(--text); font-size: 13px; font-family: inherit; outline: none; appearance: none; transition: 0.2s; }
header select:focus, header input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--primary-glow); }
header select.with-icon { padding-left: 36px; min-width: 180px; font-weight: 600; cursor: pointer; }
header select:not(.with-icon) { cursor: pointer; }
#model { flex: 1; min-width: 160px; font-weight: 500; }
.btn-icon { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-icon:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
.btn-icon.danger:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #fca5a5; }
.badge { background: var(--primary-glow); color: #fff; border-radius: 20px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
#tokenBar { padding: 8px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: center; font-size: 12px; flex-shrink: 0; }
.stat { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font-weight: 500; }
.stat strong { color: var(--text); }
#tokenTrack { flex: 1; height: 6px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; min-width: 100px; }
#tokenFill { height: 100%; width: 0%; background: var(--gradient); transition: width 0.4s ease, background 0.3s ease; border-radius: 10px; }
#quotaInfo { color: var(--success); font-weight: 600; background: rgba(16,185,129,0.1); padding: 4px 10px; border-radius: 6px; font-size: 11px; }
#quotaInfo:empty { display: none; }
.layout { flex: 1; display: flex; overflow: hidden; position: relative; }
aside { width: 280px; background: var(--bg-surface); border-right: 1px solid var(--border); flex-shrink: 0; transition: transform 0.3s; display: flex; flex-direction: column; z-index: 5; }
.sb-section { padding: 16px; border-bottom: 1px solid var(--border); }
.sb-section:last-child { border-bottom: none; flex: 1; overflow-y: auto; }
.sb-section h3 { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; font-weight: 700; display: flex; justify-content: space-between; }
.btn-new { width: 100%; padding: 12px; background: var(--gradient); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(99,102,241,0.2); }
.btn-new:hover { background: var(--gradient-hover); transform: translateY(-1px); }
.chat-item { padding: 12px 14px; background: transparent; border-radius: var(--radius-sm); margin-bottom: 4px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; border: 1px solid transparent; color: var(--text-muted); transition: 0.2s; }
.chat-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
.chat-item.active { background: rgba(99,102,241,0.1); border-color: rgba(99,102,241,0.2); color: var(--text); font-weight: 500; }
.chat-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.chat-item button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; opacity: 0; }
.chat-item:hover button { opacity: 1; } .chat-item button:hover { color: var(--danger); }
.file { padding: 10px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
.file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.file button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; } .file button:hover { color: var(--danger); }
aside input[type=file] { font-size: 12px; width: 100%; color: var(--text-muted); margin-top: 8px; }
aside input[type=file]::file-selector-button { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; transition: 0.2s; }
main { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
.msg { max-width: 85%; padding: 16px 20px; border-radius: var(--radius-lg); line-height: 1.6; font-size: 15px; position: relative; animation: slideUp 0.3s ease; word-wrap: break-word; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; background: var(--gradient); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(99,102,241,0.2); }
.msg.assistant { align-self: flex-start; background: var(--bg-surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.assistant::before { content: '✨'; position: absolute; left: -40px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.msg.tool { align-self: flex-start; background: rgba(16,185,129,0.05); border: 1px solid rgba(16,185,129,0.2); font-size: 12px; font-family: monospace; color: #6ee7b7; padding: 10px 14px; border-radius: var(--radius-sm); margin-left: 40px; }
.msg.error { align-self: center; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; font-size: 13px; padding: 12px 16px; border-radius: var(--radius-sm); text-align: center; }
.msg.memory { align-self: center; background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.2); font-size: 13px; color: #d8b4fe; padding: 8px 16px; border-radius: 20px; }
.typing { align-self: flex-start; background: var(--bg-surface); border: 1px solid var(--border); padding: 18px 22px; border-radius: var(--radius-lg); border-bottom-left-radius: 4px; display: flex; gap: 6px; align-items: center; position: relative; }
.typing::before { content: '✨'; position: absolute; left: -40px; top: 14px; width: 28px; height: 28px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.4s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: 0.2s; } .typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
#chatPlaceholder { color: var(--text-muted); text-align: center; margin: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#chatPlaceholder .ph-icon { font-size: 50px; filter: drop-shadow(0 0 15px rgba(99,102,241,0.5)); }
#chatPlaceholder .ph-title { font-size: 20px; font-weight: 700; color: var(--text); }
#chatPlaceholder .ph-sub { font-size: 14px; color: var(--text-muted); }
footer { padding: 20px; background: var(--bg-glass); backdrop-filter: blur(16px); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-end; flex-shrink: 0; }
footer textarea { flex: 1; padding: 14px 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: var(--text); resize: none; min-height: 52px; max-height: 200px; font-family: inherit; font-size: 15px; line-height: 1.5; transition: 0.2s; outline: none; }
footer textarea:focus { border-color: var(--border-focus); background: rgba(0,0,0,0.5); box-shadow: 0 0 0 3px var(--primary-glow); }
footer button { height: 52px; padding: 0 24px; border-radius: var(--radius-lg); background: var(--gradient); color: #fff; border: none; cursor: pointer; font-weight: 600; font-size: 15px; transition: 0.2s; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(99,102,241,0.3); }
footer button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.5); }
footer button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.overlay.active { display: flex; }
.modal { background: var(--bg-surface); border: 1px solid var(--border); padding: 28px; border-radius: var(--radius-lg); width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); animation: scaleIn 0.2s ease; }
@keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h3 { margin-bottom: 20px; font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.modal input, .modal textarea { width: 100%; padding: 14px; margin-bottom: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: inherit; outline: none; transition: 0.2s; }
.modal input:focus, .modal textarea:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--primary-glow); }
.modal button { width: 100%; padding: 14px; background: var(--gradient); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 14px; margin-bottom: 10px; transition: 0.2s; }
.modal button:hover { background: var(--gradient-hover); }
.modal button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
.modal button.secondary:hover { background: rgba(255,255,255,0.05); }
.key-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
.key-item code { background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; font-size: 12px; color: var(--success); }
.empty-state { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px; }
#sidebarToggle { display: none; }
@media (max-width: 768px) {
  #sidebarToggle { display: flex; } .brand span.brand-text { display: none; }
  aside { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 290px; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
  aside.open { transform: translateX(0); }
  main { padding: 16px; } .msg { max-width: 92%; }
  .msg.assistant::before, .msg.tool { margin-left: 0; }
  .msg.assistant::before { display: none; } .msg.tool { margin-left: 8px; }
  header { padding: 10px; gap: 8px; } header select.with-icon { min-width: 140px; }
  #tokenBar { font-size: 10px; padding: 6px 12px; } .stat strong { font-size: 11px; }
  footer { padding: 12px; gap: 8px; } footer textarea { font-size: 16px; } footer button { padding: 0 16px; }
}
</style>
</head>
<body>

<header>
  <button id="sidebarToggle" class="btn-icon" onclick="toggleSidebar()">☰</button>
  <div class="brand"><div class="brand-icon">✨</div><span class="brand-text">AI Premium</span></div>
  
  <div class="select-wrapper">
    <span class="select-icon" id="provider-icon">🤖</span>
    <select id="provider" class="with-icon" onchange="handleProviderChange()">
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
      <option value="deepseek">DeepSeek</option>
      <option value="gemini">Google Gemini</option>
      <option value="openrouter">OpenRouter</option>
      <option value="groq">Groq</option>
    </select>
  </div>
  
  <select id="model" onchange="handleModelChange()"></select>
  
  <button class="btn-icon" onclick="openMemory()">🧠 <span class="badge" id="memCount">0</span></button>
  <button class="btn-icon" onclick="openSettings()">⚙️ Keys</button>
  <button class="btn-icon danger" onclick="doLogout()">Keluar</button>
</header>

<div id="tokenBar">
  <span class="stat">📊 <strong id="tokenCount">0</strong> / <span id="tokenLimit">128k</span> token</span>
  <div id="tokenTrack"><div id="tokenFill"></div></div>
  <span id="quotaInfo"></span>
</div>

<div class="layout">
  <aside id="sidebar">
    <div class="sb-section"><button class="btn-new" onclick="newChat()">＋ Chat Baru</button></div>
    <div class="sb-section"><h3>💬 Chats <span class="badge" id="chatCount">0</span></h3><div id="chatList"></div></div>
    <div class="sb-section"><h3>📁 Files <span class="badge" id="fileCount">0</span>/20</h3><input type="file" id="fileInput" multiple><div id="fileList" style="margin-top:12px;"></div></div>
  </aside>
  
  <main id="chat">
    <div id="chatPlaceholder"><span class="ph-icon">🚀</span><div class="ph-title">Mulai Percakapan</div><div class="ph-sub">Pilih model favoritmu dan mulailah berkreasi.</div></div>
  </main>
</div>

<footer>
  <textarea id="input" placeholder="Ketik pesan..." rows="1"></textarea>
  <button id="send" onclick="send()"><span id="sendLabel">Kirim</span></button>
</footer>

<div id="loginOverlay" class="overlay active">
  <div class="modal"><h3>🔒 Akses Terbatas</h3><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password"><button onclick="doLogin()">Masuk</button><div id="loginError" class="error" style="color:var(--danger);text-align:center;margin-top:10px;font-size:13px;"></div></div>
</div>

<div id="settingsOverlay" class="overlay">
  <div class="modal">
    <h3>⚙️ API Keys</h3>
    <div id="keyList" style="margin-bottom:20px;"></div>
    <input id="newProvider" list="provider-list" placeholder="Provider (openai / anthropic / deepseek / gemini / openrouter / groq)">
    <datalist id="provider-list"><option value="openai"></option><option value="anthropic"></option><option value="deepseek"></option><option value="gemini"></option><option value="openrouter"></option><option value="groq"></option></datalist>
    <input id="newKey" type="password" placeholder="API Key">
    <button onclick="saveKey()">Simpan</button>
    <button class="secondary" onclick="closeSettings()">Tutup</button>
  </div>
</div>

<div id="memoryOverlay" class="overlay">
  <div class="modal"><h3>🧠 Memori AI</h3><div id="memoryList" style="margin-bottom:20px;max-height:40vh;overflow-y:auto;"></div><textarea id="newMemory" placeholder="Tambah fakta manual..."></textarea><button onclick="addMemory()">＋ Tambah</button><button class="secondary" onclick="closeMemory()">Tutup</button></div>
</div>

<script>
const $ = s => document.querySelector(s);
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatTokens = n => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(n);

const PROVIDER_ICONS = { openai: '🤖', anthropic: '🧠', deepseek: '🐳', gemini: '✨', openrouter: '🔀', groq: '⚡' };
const MODEL_LIMITS = { 'gpt-4o': 128000, 'gpt-4o-mini': 128000, 'o1-preview': 128000, 'o1-mini': 128000, 'claude-3-5-sonnet-20241022': 200000, 'claude-3-5-haiku-20241022': 200000, 'claude-3-opus-20240229': 200000, 'deepseek-chat': 64000, 'deepseek-reasoner': 64000, 'gemini-4-argon': 1048576, 'gemini-3.8-flash': 1048576, 'gemini-3.7-flash': 1048576, 'gemini-3.6-flash': 1048576, 'gemini-3.5-flash-lite': 1048576, 'llama-3.3-70b-versatile': 128000, 'llama-3.1-8b-instant': 128000, 'mixtral-8x7b-32768': 32768 };
const PROVIDER_MODELS = { openai: ['gpt-4o', 'gpt-4o-mini', 'o1-preview', 'o1-mini'], anthropic: ['claude-3-5-sonnet-20241022', 'claude-3-5-haiku-20241022', 'claude-3-opus-20240229'], deepseek: ['deepseek-chat', 'deepseek-reasoner'], gemini: ['gemini-3.6-flash', 'gemini-4-argon', 'gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.5-flash-lite'], openrouter: ['deepseek/deepseek-r1', 'google/gemini-1.5-pro', 'anthropic/claude-3.5-sonnet', 'openai/gpt-4o', 'meta-llama/llama-3.3-70b-instruct'], groq: ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'mixtral-8x7b-32768'] };

let db, files = [];
const DB_NAME = 'ai_agent', STORE = 'files';
const MAX_FILES = 20, MAX_TOTAL = 500 * 1024 * 1024;
let chats = [], currentChatId = null, messages = [], busy = false;
let sessionUsage = { total: 0 }, lastContextTokens = 0, quotaRemaining = null, quotaLimit = null;

function resetUsage() { sessionUsage = { total: 0 }; lastContextTokens = 0; updateTokenBar(); }
function updateTokenBar() {
  const model = $('#model').value; const limit = MODEL_LIMITS[model] || 128000;
  const used = lastContextTokens > 0 ? lastContextTokens : sessionUsage.total;
  const pct = Math.min(100, (used / limit) * 100);
  const fill = $('#tokenFill'); fill.style.width = pct + '%';
  fill.style.background = pct > 80 ? 'linear-gradient(135deg,#ef4444,#f97316)' : pct > 50 ? 'linear-gradient(135deg,#f59e0b,#fbbf24)' : 'var(--gradient)';
  $('#tokenCount').textContent = formatTokens(used); $('#tokenLimit').textContent = formatTokens(limit);
  const provider = $('#provider').value;
  if (provider === 'openrouter' && quotaRemaining !== null) $('#quotaInfo').textContent = `💰 $${Number(quotaRemaining).toFixed(2)} sisa`;
  else if (provider === 'groq' && quotaRemaining !== null) $('#quotaInfo').textContent = `⚡ ${formatTokens(quotaRemaining)} sisa`;
  else $('#quotaInfo').textContent = '';
}

function openDB() { return new Promise((res, rej) => { const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = () => req.result.createObjectStore(STORE); req.onsuccess = () => { db = req.result; res(); }; req.onerror = () => rej(req.error); }); }
const tx = m => db.transaction(STORE, m).objectStore(STORE);
const dbPut = (k, v) => new Promise((res, rej) => { const r = tx('readwrite').put(v, k); r.onsuccess = res; r.onerror = () => rej(r.error); });
const dbGet = k => new Promise((res, rej) => { const r = tx('readonly').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbKeys = () => new Promise((res, rej) => { const r = tx('readonly').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const dbDel = k => new Promise((res, rej) => { const r = tx('readwrite').delete(k); r.onsuccess = res; r.onerror = () => rej(r.error); });
const isTextFile = f => f.type.startsWith('text/') || /\.(md|txt|json|js|ts|jsx|tsx|py|html|css|csv|xml|yaml|yml|sh|java|c|cpp|h|go|rs|rb|php|sql|log|env|toml|ini)$/i.test(f.name);

async function refreshFiles() {
  const keys = await dbKeys(); files = [];
  for (const k of keys) { const m = await dbGet(k); if (m) files.push({ id: k, name: m.name, size: m.size, type: m.type, isText: m.isText }); }
  $('#fileCount').textContent = files.length; const list = $('#fileList'); list.innerHTML = '';
  if (!files.length) { list.innerHTML = '<div class="empty-state">Belum ada file.</div>'; return; }
  files.forEach(f => { const div = document.createElement('div'); div.className = 'file'; const span = document.createElement('span'); span.title = f.name; span.innerHTML = `${f.name.length > 18 ? f.name.slice(0,18)+'…' : f.name} <span class="file-meta">· ${fmtSize(f.size)}</span>`; const btn = document.createElement('button'); btn.textContent = '✕'; btn.onclick = async () => { await dbDel(f.id); await refreshFiles(); }; div.appendChild(span); div.appendChild(btn); list.appendChild(div); });
}

$('#fileInput').onchange = async e => {
  const selected = Array.from(e.target.files); let total = files.reduce((s, f) => s + f.size, 0);
  for (const file of selected) {
    if (files.length >= MAX_FILES) { alert('Maksimal 20 file.'); break; }
    if (total + file.size > MAX_TOTAL) { alert('Total > 500MB.'); break; }
    const id = 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    if (isTextFile(file)) { const content = await file.text(); await dbPut(id, { name: file.name, size: file.size, type: file.type, isText: true, content }); }
    else { const buf = await file.arrayBuffer(); const bytes = new Uint8Array(buf); let bin = ''; const CH = 0x8000; for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); await dbPut(id, { name: file.name, size: file.size, type: file.type, isText: false, content: btoa(bin) }); }
    total += file.size;
  }
  e.target.value = ''; await refreshFiles();
};

function updateModelDropdown() {
  const p = $('#provider').value; const sel = $('#model');
  sel.innerHTML = (PROVIDER_MODELS[p] || []).map(m => `<option value="${m}">${m}</option>`).join('');
  const saved = localStorage.getItem('agent_model_' + p);
  if (saved && Array.from(sel.options).some(o => o.value === saved)) sel.value = saved;
  else sel.value = PROVIDER_MODELS[p]?.[0] || '';
  $('#provider-icon').textContent = PROVIDER_ICONS[p] || '🤖'; updateTokenBar();
}
function handleProviderChange() { localStorage.setItem('agent_provider', $('#provider').value); updateModelDropdown(); quotaRemaining = null; quotaLimit = null; fetchQuota(); }
function handleModelChange() { localStorage.setItem('agent_model_' + $('#provider').value, $('#model').value); updateTokenBar(); }
$('#provider').value = localStorage.getItem('agent_provider') || 'openai'; updateModelDropdown();

function toggleSidebar() { $('#sidebar').classList.toggle('open'); }
document.addEventListener('click', e => { if (window.innerWidth > 768) return; const sb = $('#sidebar'); if (!sb.classList.contains('open')) return; if (sb.contains(e.target) || e.target.closest('#sidebarToggle')) return; sb.classList.remove('open'); });

async function doLogin() { const password = $('#loginPassword').value; if (!password) return; const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) }); if (r.ok) { $('#loginError').textContent = ''; $('#loginPassword').value = ''; await bootAfterLogin(); } else $('#loginError').textContent = 'Password salah'; }
$('#loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogout() { await fetch('/api/logout', { method: 'POST' }); location.reload(); }
async function checkAuth() { const r = await fetch('/api/keys'); return r.status !== 401; }

async function openSettings() { $('#settingsOverlay').classList.add('active'); await loadKeys(); }
function closeSettings() { $('#settingsOverlay').classList.remove('active'); }
async function loadKeys() { const r = await fetch('/api/keys'); if (r.status === 401) { closeSettings(); $('#loginOverlay').classList.add('active'); return; } const keys = await r.json(); const el = $('#keyList'); el.innerHTML = Object.keys(keys).length ? Object.entries(keys).map(([p, k]) => `<div class="key-item"><div style="flex:1;min-width:0;"><div style="font-weight:600;margin-bottom:4px;text-transform:capitalize;">${p}</div><code>${k}</code></div><button class="btn-icon danger" onclick="delKey('${p}')">Hapus</button></div>`).join('') : '<div class="empty-state">Belum ada key.</div>'; }
async function saveKey() { const provider = $('#newProvider').value.trim().toLowerCase(); const key = $('#newKey').value.trim(); if (!provider || !key) return alert('Isi provider dan key'); const r = await fetch('/api/keys', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider, key }) }); if (r.ok) { $('#newKey').value = ''; $('#newProvider').value = ''; await loadKeys(); await fetchQuota(); } else alert('Gagal simpan'); }
async function delKey(p) { if (!confirm('Hapus key ' + p + '?')) return; await fetch('/api/keys', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provider: p }) }); await loadKeys(); }

async function fetchQuota() { const provider = $('#provider').value; if (provider === 'openrouter') { try { const r = await fetch('/api/quota?provider=openrouter'); if (r.ok) { const d = await r.json(); quotaRemaining = d.limit_remaining; quotaLimit = d.limit; } } catch (e) {} } else if (provider !== 'groq') quotaRemaining = null; updateTokenBar(); }

let memoryFacts = [];
async function openMemory() { await loadMemory(); renderMemory(); $('#memoryOverlay').classList.add('active'); }
function closeMemory() { $('#memoryOverlay').classList.remove('active'); }
async function loadMemory() { const r = await fetch('/api/memory'); if (r.status === 401) return; memoryFacts = await r.json(); $('#memCount').textContent = memoryFacts.length; }
function renderMemory() { const el = $('#memoryList'); el.innerHTML = memoryFacts.length ? memoryFacts.map(m => `<div class="key-item"><span style="color:var(--text);line-height:1.5;">${escapeHtml(m.text)}</span><button class="btn-icon danger" onclick="delMemory('${m.id}')">Hapus</button></div>`).join('') : '<div class="empty-state">Belum ada memori.</div>'; }
async function addMemory() { const text = $('#newMemory').value.trim(); if (!text) return; await fetch('/api/memory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }); $('#newMemory').value = ''; await loadMemory(); renderMemory(); }
async function delMemory(id) { await fetch(`/api/memory?id=${id}`, { method: 'DELETE' }); await loadMemory(); renderMemory(); }

async function loadChats() { const r = await fetch('/api/chats'); if (r.status === 401) { $('#loginOverlay').classList.add('active'); return; } chats = await r.json(); $('#chatCount').textContent = chats.length; renderChats(); }
function renderChats() { const el = $('#chatList'); el.innerHTML = chats.length ? chats.map(c => `<div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="switchChat('${c.id}')"><span>${escapeHtml(c.title || 'Untitled')}</span><button onclick="event.stopPropagation();deleteChat('${c.id}')">✕</button></div>`).join('') : '<div class="empty-state">Belum ada chat.</div>'; }
async function newChat() { const r = await fetch('/api/chats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: 'Chat Baru' }) }); const chat = await r.json(); currentChatId = chat.id; messages = []; resetUsage(); renderMessages(); await loadChats(); if (window.innerWidth <= 768) $('#sidebar').classList.remove('open'); $('#input').focus(); }
async function switchChat(id) { currentChatId = id; const r = await fetch(`/api/chats?id=${id}`); if (!r.ok) { alert('Gagal load chat'); return; } const chat = await r.json(); messages = chat.messages || []; resetUsage(); renderMessages(); renderChats(); if (window.innerWidth <= 768) $('#sidebar').classList.remove('open'); }
async function deleteChat(id) { if (!confirm('Hapus chat ini?')) return; await fetch(`/api/chats?id=${id}`, { method: 'DELETE' }); if (currentChatId === id) { currentChatId = null; messages = []; resetUsage(); renderMessages(); } await loadChats(); if (chats.length > 0) await switchChat(chats[0].id); else await newChat(); }
async function saveCurrentChat() { if (!currentChatId) return; let title; const cur = chats.find(c => c.id === currentChatId); if (cur && (cur.title === 'Chat Baru' || !cur.title)) { const first = messages.find(m => m.role === 'user'); if (first) title = first.content.slice(0, 60) + (first.content.length > 60 ? '…' : ''); } const body = { messages }; if (title) body.title = title; await fetch(`/api/chats?id=${currentChatId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); await loadChats(); }

function renderMessages() {
  const chatEl = $('#chat'); chatEl.innerHTML = '';
  if (messages.length === 0) { chatEl.innerHTML = `<div id="chatPlaceholder"><span class="ph-icon">🚀</span><div class="ph-title">Chat Baru</div><div class="ph-sub">Mulai ketik pesan di bawah.</div></div>`; return; }
  for (const m of messages) { if (m.role === 'system') continue; if (m.role === 'user') addMsgEl('user', m.content); else if (m.role === 'assistant') { if (m.content) addMsgEl('assistant', m.content); if (m.tool_calls) for (const tc of m.tool_calls) addMsgEl('tool', `🔧 ${tc.function.name}(${String(tc.function.arguments).slice(0, 120)})`); } }
}
function addMsgEl(role, content) { const ph = $('#chatPlaceholder'); if (ph) ph.remove(); const div = document.createElement('div'); div.className = 'msg ' + role; div.textContent = content; $('#chat').appendChild(div); $('#chat').scrollTop = $('#chat').scrollHeight; }
function showTyping() { removeTyping(); const div = document.createElement('div'); div.id = 'typingIndicator'; div.className = 'typing'; div.innerHTML = '<span></span><span></span><span></span>'; $('#chat').appendChild(div); $('#chat').scrollTop = $('#chat').scrollHeight; }
function removeTyping() { const el = $('#typingIndicator'); if (el) el.remove(); }
function setSendBusy(isBusy) { const btn = $('#send'); btn.disabled = isBusy; if (isBusy) btn.innerHTML = '<span class="spinner"></span>'; else btn.innerHTML = '<span id="sendLabel">Kirim</span>'; }

const SYSTEM_PROMPT = `Kamu adalah AI agent premium yang cerdas dan membantu. User bisa mengupload file dan menyimpan chat lama. 
Gunakan tool 'search_internet' jika user bertanya tentang berita terkini, fakta terbaru, atau hal yang kamu tidak yakin. 
Jangan pernah membalas dengan kosong. Jika pencarian gagal, katakan dengan jujur bahwa kamu tidak bisa menemukan informasinya saat ini.
Jawab dengan gaya bahasa yang natural dan profesional, kamu adalah seorang developer, dan suka ngereverse engineering sebuah game yang sudah mati.`;
const TOOLS = [
  { type: 'function', function: { name: 'list_files', description: 'Tampilkan daftar file', parameters: { type: 'object', properties: {} } } },
  { type: 'function', function: { name: 'read_file', description: 'Baca isi file text.', parameters: { type: 'object', properties: { name: { type: 'string' }, offset: { type: 'integer' }, limit: { type: 'integer' } }, required: ['name'] } } },
  { type: 'function', function: { name: 'search_files', description: 'Cari kata kunci di file', parameters: { type: 'object', properties: { query: { type: 'string' } }, required: ['query'] } } },
  { type: 'function', function: { name: 'list_recent_chats', description: 'Daftar chat sebelumnya', parameters: { type: 'object', properties: { limit: { type: 'integer' } } } } },
  { type: 'function', function: { name: 'read_chat', description: 'Baca isi chat lama', parameters: { type: 'object', properties: { id: { type: 'string' }, limit: { type: 'integer' } }, required: ['id'] } } },
  // TAMBAHAN TOOL SEARCH INTERNET
  { type: 'function', function: { name: 'search_internet', description: 'Cari informasi terbaru di internet menggunakan mesin pencari. Gunakan ini jika kamu butuh berita terkini, fakta terbaru, atau informasi yang tidak ada di pengetahuanmu.', parameters: { type: 'object', properties: { query: { type: 'string', description: 'Kata kunci pencarian' } }, required: ['query'] } } }
];

async function callTool(name, a) {
  if (name === 'list_files') return files.length ? files.map(f => `${f.name} (${fmtSize(f.size)}, ${f.isText ? 'text' : 'binary'})`).join('\n') : 'Tidak ada file.';
  if (name === 'read_file') { const f = files.find(x => x.name === a.name); if (!f) return `File "${a.name}" tidak ditemukan.`; if (!f.isText) return `File "${a.name}" bukan text.`; const d = await dbGet(f.id); const offset = a.offset || 0, limit = Math.min(a.limit || 8000, 20000); return `[${f.name} | total ${d.content.length} char | offset ${offset}]\n${d.content.slice(offset, offset + limit)}`; }
  if (name === 'search_files') { const q = a.query.toLowerCase(); const out = []; for (const f of files) { if (!f.isText) continue; const d = await dbGet(f.id); const i = d.content.toLowerCase().indexOf(q); if (i >= 0) out.push(`=== ${f.name} ===\n...${d.content.slice(Math.max(0, i - 80), i + 160)}...`); } return out.length ? out.join('\n\n') : 'Tidak ada hasil.'; }
  if (name === 'list_recent_chats') { const r = await fetch('/api/chats'); const list = await r.json(); const lim = a.limit || 5; return list.slice(0, lim).map(c => `[${c.id}] ${c.title} (${new Date(c.updatedAt).toLocaleDateString('id-ID')})`).join('\n') || 'Belum ada chat.'; }
  if (name === 'read_chat') { const r = await fetch(`/api/chats?id=${a.id}`); if (!r.ok) return 'Chat tidak ditemukan.'; const chat = await r.json(); const msgs = (chat.messages || []).filter(m => m.role === 'user' || m.role === 'assistant').slice(-(a.limit || 20)); return `=== ${chat.title} ===\n\n` + msgs.map(m => `${m.role.toUpperCase()}: ${String(m.content || '').slice(0, 500)}`).join('\n\n'); }
  if (name === 'remember') { if (!a.text || !a.text.trim()) return 'Gagal.'; const r = await fetch('/api/memory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: a.text }) }); if (r.ok) { await loadMemory(); addMsgEl('memory', `🧠 Diingat: ${a.text}`); return `✓ Tersimpan.`; } return 'Gagal.'; }
  
  // HANDLER SEARCH INTERNET
  if (name === 'search_internet') {
    const r = await fetch('/api/search', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: a.query })
    });
    if (!r.ok) return 'Gagal mencari di internet.';
    const data = await r.json();
    if (data.error) return `Error pencarian: ${data.error}`;
    return data.results.map(x => `- ${x.title}\n${x.content}\nSumber: ${x.url}`).join('\n\n');
  }
  
  return 'Tool tidak dikenal.';
}

async function send() {
  if (busy) return; const text = $('#input').value.trim(); if (!text) return; if (!currentChatId) await newChat();
  const provider = $('#provider').value; const model = $('#model').value; if (!model) return alert('Pilih model');
  busy = true; setSendBusy(true); $('#input').value = ''; $('#input').style.height = 'auto'; addMsgEl('user', text); messages.push({ role: 'user', content: text }); showTyping();
  try {
    for (let guard = 0; guard < 12; guard++) {
            // Ambil tanggal & jam real-time dari device user
      const now = new Date();
      const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      
      // Sisipkan info ini ke System Prompt
      const dynamicPrompt = SYSTEM_PROMPT + `\n\n[INFO REAL-TIME]: Hari ini adalah ${dateStr}, pukul ${timeStr} (Waktu Lokal User). JIKA user bertanya tentang tanggal atau waktu, LANGSUNG jawab menggunakan info ini. JANGAN menebak atau mencari di internet untuk urusan tanggal.`;

      const res = await fetch('/api/chat', { 
        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ 
          provider, model, 
          messages: [{ role: 'system', content: dynamicPrompt }, ...messages], // <-- Pakai dynamicPrompt
          tools: TOOLS 
        }) 
      });
      if (res.status === 401) { removeTyping(); addMsgEl('error', '❌ Sesi habis.'); $('#loginOverlay').classList.add('active'); break; }
      if (!res.ok) { const errText = await res.text(); throw new Error(`${res.status}: ${errText.slice(0, 200)}`); }
      const data = await res.json();
      if (data.usage) { sessionUsage.total += (data.usage.total_tokens || 0); lastContextTokens = (data.usage.prompt_tokens || 0) + (data.usage.completion_tokens || 0); updateTokenBar(); }
      const msg = data.choices?.[0]?.message; if (!msg) throw new Error('Response LLM tidak valid'); messages.push(msg);
      if (msg.tool_calls?.length) { removeTyping(); for (const tc of msg.tool_calls) { const args = JSON.parse(tc.function.arguments || '{}'); addMsgEl('tool', `🔧 ${tc.function.name}(${JSON.stringify(args).slice(0, 80)})`); const result = await callTool(tc.function.name, args); messages.push({ role: 'tool', tool_call_id: tc.id, content: result }); } showTyping(); }
      else { removeTyping(); addMsgEl('assistant', msg.content || '(kosong)'); break; }
    }
  } catch (e) { removeTyping(); addMsgEl('error', '❌ ' + e.message); }
  finally { removeTyping(); busy = false; setSendBusy(false); if (currentChatId) await saveCurrentChat(); updateTokenBar(); }
}

$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('#input').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 200) + 'px'; });

async function bootAfterLogin() { $('#loginOverlay').classList.remove('active'); await loadChats(); await loadMemory(); await fetchQuota(); if (chats.length > 0) await switchChat(chats[0].id); else await newChat(); }
(async () => { await openDB(); await refreshFiles(); const ok = await checkAuth(); if (!ok) { $('#loginOverlay').classList.add('active'); return; } await bootAfterLogin(); })();
</script>
